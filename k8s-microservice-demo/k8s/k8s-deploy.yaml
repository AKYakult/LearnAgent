# ============================================================
# K8s 编排文件 —— 一次提交，K8s 管家自动拉起整个微服务集群
# 包含 4 个对象：2 个 Deployment(管副本/自愈) + 2 个 Service(管网络/负载均衡)
# ============================================================

# ---------- 1. 商品服务 Deployment：2 个副本（模拟分布式多节点）----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-deployment
spec:
  replicas: 2                          # 启动 2 个商品 Pod
  selector:
    matchLabels:
      app: product
  template:
    metadata:
      labels:
        app: product
    spec:
      containers:
      - name: product
        image: localhost:5000/product-service:latest
        imagePullPolicy: Always          # 从本地 registry 拉取
        ports:
        - containerPort: 8081
---
# ---------- 2. 商品服务 Service：集群内部 DNS 名 = product-service ----------
apiVersion: v1
kind: Service
metadata:
  name: product-service                 # ← order-service 代码里写的就是这个域名
spec:
  selector:
    app: product
  ports:
  - port: 8081
    targetPort: 8081
---
# ---------- 3. 订单服务 Deployment：1 个副本 ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order
  template:
    metadata:
      labels:
        app: order
    spec:
      containers:
      - name: order
        image: localhost:5000/order-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: PRODUCT_SERVICE_HOST        # 覆盖 application.yml 里的默认值 localhost
          value: product-service            # K8s Service 的 DNS 名
        - name: PRODUCT_SERVICE_PORT        # K8s 会自动注入 tcp://10.96.x.x:8081，这里覆盖成纯数字
          value: "8081"
---
# ---------- 4. 订单服务 Service：NodePort 暴露给外部浏览器访问 ----------
apiVersion: v1
kind: Service
metadata:
  name: order-service
spec:
  type: NodePort
  selector:
    app: order
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30080                     # 浏览器访问 http://localhost:30080
