server:
  port: 8080

spring:
  application:
    name: MyAgent

logging:
  level:
    jin.agent.react: DEBUG

# 大模型连接配置（支持从根目录 .env 文件或系统环境变量中自动注入）
llm:
  sensenova:
    api-key: ${SENSENOVA_API_KEY:}
    base-url: ${SENSENOVA_BASE_URL:https://token.sensenova.cn/v1}
    model-name: ${SENSENOVA_MODEL_NAME:sensenova-6.8-flash-lite}
    log-requests: ${SENSENOVA_LOG_REQUESTS:true}
    log-responses: ${SENSENOVA_LOG_RESPONSES:true}
    temperature: 0.2
    timeout-seconds: 60

# 本地 Ollama Embedding 模型配置
ollama:
  base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
  embedding-model-name: ${OLLAMA_EMBEDDING_MODEL_NAME:bge-m3}
  timeout-seconds: 60

# 向量数据库 Qdrant 配置
qdrant:
  host: ${QDRANT_HOST:localhost}
  port: ${QDRANT_PORT:6334}
  collection-name: ${QDRANT_COLLECTION_NAME:myagent_knowledge}
